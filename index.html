<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PH Fuel Price Daily Monitor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/60 sticky top-0 z-50 backdrop-blur">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl">⛽</span>
        <h1 class="font-bold text-lg text-white">PH Fuel Price Daily Monitor</h1>
      </div>
      <span class="text-xs bg-slate-800 text-slate-400 px-3 py-1 rounded-full border border-slate-700" id="last-updated">
        Loading data...
      </span>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8 space-y-8">

    <!-- 3-Column Fuel Grid (Diesel, Unleaded, Premium) -->
    <section>
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Projected Weekly Fuel Movement</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="fuel-grid">
        <!-- Cards injected dynamically via JS -->
      </div>
    </section>

    <!-- Fuel Trading Trends Chart -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
        <div>
          <h3 class="font-bold text-slate-200">Fuel Trading Trend (MOPS Proxies)</h3>
          <p class="text-xs text-slate-400">7-day benchmark movement per liter in PHP</p>
        </div>
      </div>
      <div class="h-64 w-full">
        <canvas id="fuelTrendChart"></canvas>
      </div>
    </section>

    <!-- USD/PHP Dollar Trend Chart -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
      <div class="mb-4">
        <h3 class="font-bold text-slate-200">USD/PHP Exchange Rate Trend</h3>
        <p class="text-xs text-slate-400">Bangko Sentral / Forex daily conversion benchmark</p>
      </div>
      <div class="h-48 w-full">
        <canvas id="forexTrendChart"></canvas>
      </div>
    </section>

  </main>

  <script>
    let fuelChart, forexChart;

    async function loadDashboard() {
      try {
        const res = await fetch('./data.json?cache_bust=' + new Date().getTime());
        if (!res.ok) throw new Error("Data fetch error");
        const data = await res.json();

        document.getElementById('last-updated').innerText = 'Updated: ' + data.updated_at;

        // 1. Render Fuel Cards
        const grid = document.getElementById('fuel-grid');
        grid.innerHTML = '';

        const fuels = [data.fuels.diesel, data.fuels.unleaded, data.fuels.premium];

        fuels.forEach(fuel => {
          const isHike = fuel.est_impact > 0;
          const sign = isHike ? '+' : '';
          const badgeBg = isHike ? 'bg-rose-500/20 text-rose-400 border-rose-500/30' : 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30';
          const cardBorder = isHike ? 'border-rose-500/30' : 'border-emerald-500/30';

          grid.innerHTML += `
            <div class="bg-slate-900 border ${cardBorder} rounded-2xl p-5 flex flex-col justify-between shadow-lg">
              <div>
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">${fuel.name}</span>
                <div class="flex items-baseline gap-2 mt-3">
                  <span class="text-3xl font-black">${sign}₱${Math.abs(fuel.est_impact).toFixed(2)}</span>
                  <span class="text-xs font-bold px-2 py-1 rounded border ${badgeBg}">${fuel.status}</span>
                </div>
              </div>
              <div class="mt-4 pt-3 border-t border-slate-800 flex justify-between text-xs text-slate-400">
                <span>Proxy Benchmark:</span>
                <span class="text-slate-200 font-medium">$${fuel.price_bbl.toFixed(2)} /bbl</span>
              </div>
            </div>
          `;
        });

        // 2. Render Fuel Trading Chart
        const dates = data.fuels.diesel.dates;
        const ctxFuel = document.getElementById('fuelTrendChart').getContext('2d');
        
        if (fuelChart) fuelChart.destroy();
        fuelChart = new Chart(ctxFuel, {
          type: 'line',
          data: {
            labels: dates,
            datasets: [
              { label: 'Diesel', data: data.fuels.diesel.trend, borderColor: '#f43f5e', tension: 0.3 },
              { label: 'Unleaded (92)', data: data.fuels.unleaded.trend, borderColor: '#38bdf8', tension: 0.3 },
              { label: 'Premium (95)', data: data.fuels.premium.trend, borderColor: '#a855f7', tension: 0.3 }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { labels: { color: '#94a3b8' } } },
            scales: {
              x: { ticks: { color: '#64748b' }, grid: { color: '#1e293b' } },
              y: { ticks: { color: '#64748b' }, grid: { color: '#1e293b' } }
            }
          }
        });

        // 3. Render Dollar Trend Chart
        const ctxForex = document.getElementById('forexTrendChart').getContext('2d');
        if (forexChart) forexChart.destroy();
        forexChart = new Chart(ctxForex, {
          type: 'line',
          data: {
            labels: data.forex.trend_dates,
            datasets: [{
              label: 'USD/PHP Rate',
              data: data.forex.rates,
              borderColor: '#f59e0b',
              backgroundColor: 'rgba(245, 158, 11, 0.1)',
              fill: true,
              tension: 0.3
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { ticks: { color: '#64748b' }, grid: { color: '#1e293b' } },
              y: { ticks: { color: '#64748b' }, grid: { color: '#1e293b' } }
            }
          }
        });

      } catch (err) {
        console.error("Dashboard error:", err);
      }
    }

    loadDashboard();
  </script>

</body>
</html>
