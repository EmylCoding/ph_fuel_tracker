name: Daily Fuel Data Update

on:
  schedule:
    - cron: '0 10 * * *' # Runs every day at 6:00 PM Philippine Time (10:00 AM UTC)
  workflow_dispatch:     # Enables a manual "Run" button in GitHub UI

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and Push Updated data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily fuel data" && git push)
