name: Daily Fuel Data Update

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission for git commit & push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: Sync Baselines from GasWatch PH
        run: python fetch_gaswatch.py

      - name: Run Market Forecasting Scraper
        run: python scraper.py

      - name: Commit and Push Updated State Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json baselines.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily fuel data and baselines" && git push)
